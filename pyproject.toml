[project]
name = "ha-notify-digest"
version = "0.0.2"
description = "Home Assistant integration that coalesces notifications within a time window into a single digest message before forwarding to a downstream notify service."
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component>=0.13.323",
]
lint = [
  "pre-commit>=4.5",
]

[tool.uv]
prerelease = "allow"
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
