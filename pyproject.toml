[project]
name = "ha-notify-digest"
version = "0.0.7" # x-release-please-version
description = "Home Assistant integration that coalesces notifications within a time window into a single digest message before forwarding to a downstream notify service."
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  # Pinned exactly: the plugin pins homeassistant exactly, so this IS the HA
  # under test. A `>=` floor never changes, so Renovate never bumps it and the
  # lock silently stays on whatever HA it first resolved.
  "pytest-homeassistant-custom-component==0.13.375",
  "mypy>=1.20.0",
]

[tool.uv]
required-version = "==0.13.5"
package = false

[tool.mypy]
mypy_path = ["custom_components"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
